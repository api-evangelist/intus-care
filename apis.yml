aid: intus-care
name: Intus Care
description: >-
  IntusCare (Intus Care, Inc.) is a Providence, Rhode Island health technology company
  building an end-to-end software and services ecosystem for PACE — Programs of
  All-Inclusive Care for the Elderly. Founded in 2019 by Brown University students Robbie
  Felton, Evan Jackson and Alex Rothberg, it launched population health analytics at PACE
  of Rhode Island in 2020 and now serves 70+ PACE organizations. Its products are CareHub,
  a PACE-native ONC-certified EMR and care-management platform; IRIS, a risk-adjustment
  and coding system for PACE and value-based care organizations; and a Population Health &
  Utilization Management suite delivered with fractionally-staffed Integrated Care Services
  clinicians. IntusCare markets interoperability and out-of-the-box third-party
  administrator (TPA) integrations, but as of this profile it publishes no public developer
  program, API reference, or machine-readable contract — customer-facing surfaces are the
  authenticated CareHub and analytics applications.
